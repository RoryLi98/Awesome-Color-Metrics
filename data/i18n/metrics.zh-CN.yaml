# Canonical metric names are stable keys; titles, summaries and caveats are translated together.
"CIELAB ΔE*ab (CIE76)": {title: "CIE 015:2018《色度学》第四版：CIELAB 与 ΔE*ab 的现行定义（1976 年提出）", tldr: "计算 CIELAB 空间中的欧氏距离。公式简单、应用广泛，但会过度放大高饱和度颜色的色度差异。", note: "链接指向需付费的 CIE 015:2018 报告；公式可在常用色度学教材中找到。"}
"CMC l:c": {title: "JPC79 色差公式的修订", tldr: "依据颜色在色空间中的位置，为明度、彩度和色相差异加权；l:c（通常为 2:1）用于区分可接受性与可感知性，交换两个输入可能得到不同结果。"}
"CIE94": {title: "CIE94：一种新的色差公式", tldr: "在 CIELAB 基础上，按彩度对 ΔC 和 ΔH 加权；对应 CIE 116-1995，是 ΔE*ab 与 CIEDE2000 之间的 CIE 推荐公式。"}
"CIEDE2000": {title: "CIE 2000 色差公式 CIEDE2000 的建立", tldr: "加入明度、彩度和色相权重、蓝色区域的彩度与色相交互项，以及灰色区域 a* 轴缩放，是现行 CIE / ISO 标准色差公式。", note: "应使用 Sharma、Wu 与 Dalal 的测试数据验证实现（Color Res Appl 2005，DOI：10.1002/col.20070），代码链接同时提供该数据。"}
"DIN99": {title: "基于 DIN99 色差公式的均匀色空间", tldr: "通过明度的对数变换，以及彩度轴旋转与压缩，使欧氏距离近似感知差异，包含 DIN99 及 DIN99b–d 变体。"}
"CAM02-UCS": {title: "基于 CIECAM02 颜色外观模型的均匀色空间", tldr: "从 CIECAM02 推导适用于小色差（SCD）、大色差（LCD）与一般色差（UCS）的三种均匀空间，并考虑观察条件。"}
"Power functions": {title: "利用幂函数提高色差公式的预测性能", tldr: "分别为各公式拟合幂律修正 ΔE′ = a·ΔE^b，改善 CIEDE2000、CAM02-UCS 等公式与视觉判断的一致性。"}
"CAM16-UCS": {title: "综合颜色解决方案：CAM16、CAT16 与 CAM16-UCS", tldr: "作为 CIECAM02 的简化后继模型，引入 CAT16 色适应变换，并在给定观察条件下通过均匀空间度量色差。"}
"Jzazbz": {title: "面向高动态范围与宽色域图像信号的感知均匀色空间", tldr: "采用 PQ 非线性与绝对亮度输入，面向 HDR 和宽色域信号，同时关注大小色差预测与色相线性。"}
"ΔE ITP": {title: "ITU-R BT.2124-0：电视颜色差异潜在可见性的客观评价指标", tldr: "对 BT.2100 PQ 信号计算 ICtCp 中的 720·‖Δ(I,T,P)‖；在最敏感适应状态下，1 单位约对应一个恰可察觉差异。", note: "可从 itu.int 免费下载推荐文件的 PDF。"}
"HyAB": {title: "用于极大色差的距离度量", tldr: "将明度的城市街区距离与 a*b* 平面的欧氏距离相加；在论文测试的极大色差（约 10 ΔE*ab 以上）条件下表现较好，也用于 FLIP。"}
"ZCAM": {title: "ZCAM：基于高动态范围均匀色空间的颜色外观模型", tldr: "基于 Jzazbz 预测 HDR 内容的十种外观属性，论文报告其预测精度至少可与 CIECAM02、CAM16 相当。"}
"sUCS / sCAM": {title: "基于简单均匀色空间 sUCS 的简单颜色外观模型 sCAM", tldr: "采用较简单的均匀空间与外观模型结构，在 28 组均匀性和 6 组色相线性数据上，综合排名为第一或第二。"}
"HDR-WCG projection space": {title: "面向感知均匀性与 HDR 宽色域图像处理的投影色空间", tldr: "通过两个三维投影矩阵及修订的非线性构造 HDR / 宽色域空间，并使用 STRESS、PU-PSNR、PU-SSIM 与 HDR-VDP-3 评价。"}
"Riemannian sinusoidal ΔE": {title: "用于空间正弦颜色变化的黎曼色差度量", tldr: "针对颜色在空间中呈正弦变化的刺激建立黎曼度量，使色差随空间频率变化，而非只比较两块均匀颜色。"}
"PCS26-UCS": {title: "PCS26-UCS：保持加色混合性质的感知均匀色空间", tldr: "让加色混合仍沿直线变化，同时达到接近 CAM16-UCS 的均匀性并改善色相线性。"}
"Oklab": {title: "面向图像处理的感知色空间", tldr: "采用矩阵、LMS 立方根和矩阵组成的 IPT 类结构，拟合 CAM16 的明度和彩度及 IPT 的色相；欧氏距离 ΔEOK 用于 CSS Color 4 的色域映射。", note: "优化目标是外观均匀性与色相线性，并非色差判断数据；其 COMBVD STRESS 明显高于 CIEDE2000，参见 Oklch+。"}
"Helmlab": {title: "Helmlab：面向界面设计系统的双空间解析与数据驱动色空间族", tldr: "以学习矩阵、幂压缩、傅里叶色相校正及 Helmholtz–Kohlrausch 明度项构造 XYZ 到 Lab 的解析变换；作者报告 MetricSpace 在 COMBVD 上的 STRESS 为 22.5，CIEDE2000 为 29.2。", note: "单作者预印本；作者报告在 He 等人 2022 年的三维打印样本上弱于 CIEDE2000。另一空间 GenSpace 面向渐变生成。"}
"Oklch+": {title: "Oklch+：改进色差预测的三参数 Oklab 扩展", tldr: "为 Oklab 明度加入幂函数、为彩度加入 Naka–Rushton 压缩，使用三个参数拟合色差数据；COMBVD STRESS 为 29.1，与 CIEDE2000 相近，Oklab 为 47.4。", note: "只在以 sRGB 为中心的 COMBVD 数据上评价。"}
"ML color difference (COLIBRI)": {title: "利用机器学习与人类相似性判断建立感知色差模型", tldr: "由七位观察者以四级量表评价 2,000 对颜色并训练回归模型；将 COLIBRI 模糊颜色类别特征与 RGB / HSI 差异结合时，LightGBM 达到 R² 0.70。"}
"Conformally-Euclidean line element": {title: "用于色差评价的共形欧氏线元", tldr: "为简化局部颜色判别的几何结构，以依赖亮度的因子缩放欧氏线元，推导类似 CIELAB 的感知坐标，并拟合表面色判别数据。", note: "面向局部判别，不等同于已验证的整幅摄影图像色差指标；采用 2026 年 9 月修订版。"}
"V1 Fisher color metric": {title: "从 V1 神经元群体 Fisher 信息推导三维颜色判别度量", tldr: "为联系判别阈值与神经编码，从色适应、对立通道及 V1 群体 Fisher 信息推导黎曼度量；用四组阈值数据中的 96 种判别条件拟合 17 个参数。", note: "预印本只拟合阈值数据，拟合统计量不足以证明其对大色差或摄影图像有效。"}
"IPT-LCs": {title: "亮度超过漫反射白的刺激色差表征", tldr: "为度量 HDR 高光色差，在 203 cd/m² 的 D65 漫反射白下收集 980 对、亮度为 194–977 cd/m² 的颜色判断，将 IPT 优化为 IPT-LCs，并评价白点亮度上下的刺激。", note: "实验针对指定适应条件下的色块，不是空间 HDR 图像质量评价。"}
"S-CIELAB": {title: "面向数字彩色图像再现的 CIELAB 空间扩展", tldr: "先变换至颜色对立空间，分别用各通道的对比敏感度滤波器模糊，再变换回去逐像素计算 ΔE；需要以每视角度像素数指定观察条件。", note: "低通滤波本身并不使指标具有错位容忍能力，详见入门指南。"}
"CID": {title: "图像差异预测：从灰度到彩色", tldr: "归一化后提取明度、彩度、色相与结构特征，组合成具有可解释分项的图像差异分数，并用色域映射图像调参。"}
"iCID": {title: "彩色图像质量评价：从预测到优化", tldr: "改进 CID，在改善主观差异预测的同时，使其能够作为色域映射的优化目标，减少优化产生的伪影。"}
"MS-iCID": {title: "多尺度 iCID 指标评价", tldr: "构建 iCID 的多尺度版本，并使用主观图像差异数据进行评价。"}
"FLIP": {title: "FLIP：用于交替显示图像的差异评价器", tldr: "将对比敏感度滤波后的 HyAB 颜色分支与边缘、点特征分支结合，生成近似观察者切换两幅图像时所见差异的误差图。"}
"HDR-FLIP": {title: "渲染高动态范围图像误差的可视化", tldr: "在一组曝光下对 HDR 图像进行色调映射，再逐像素取最大的 LDR-FLIP 误差，将 FLIP 扩展到 HDR。", note: "实现与 FLIP 位于同一仓库。"}
"HDR-VDP-2": {title: "HDR-VDP-2：适用于各种亮度条件的标定可见性与质量预测指标", tldr: "从绝对光度输入出发，对光学、感光细胞、对比敏感度与掩蔽建模，预测不同亮度范围下的可见性图及质量。", note: "只对非彩色视觉建模；ColorVideoVDP 是面向彩色的后继模型。"}
"HDR-VDP-3": {title: "HDR-VDP-3：预测 HDR 与普通内容的图像差异、质量及对比度失真的多任务指标", tldr: "由经过显示标定的输入同时预测三种结果：JOD 质量分数、可见差异概率图，以及对比度损失或增强图。", note: "仅亮度模型；当前发布版本为 HDR-VDP-3.0.7，采用 GPLv2 许可。"}
"ColorVideoVDP": {title: "ColorVideoVDP：面向图像、视频及显示失真的视觉差异预测器", tldr: "以彩色时空对比敏感度模型 castleCSF 与跨通道掩蔽构建全参考指标，针对指定显示设备输出 JOD 分数和逐像素失真图。", note: "模型会把 1 像素错位视为可见差异，因此不适用于未配准图像对，详见指南。"}
"ColorVideoVDP-ML": {title: "ColorVideoVDP-ML：利用神经回归器预测图像与视频质量的视觉差异模型", tldr: "以神经回归器替换 ColorVideoVDP 的人工汇聚规则，用于图像和视频质量预测。", note: "ColorVideoVDP 仓库提供 cvvdp-ml-saliency 与 cvvdp-ml-transformer 两个实现。"}
"CD-IQA (Temel 2014)": {title: "图像质量评价与色差", tldr: "研究逐像素色差公式作为全参考质量估计器的表现，以及如何汇聚这些局部差异。"}
"EDOKS": {title: "用于可解释几何与颜色评价的新图像相似度指标", tldr: "为分离纹理和颜色误差，将聚类后的 Gabor 能量特征 EMD 与逐像素 Oklab 平均距离结合，输出相似度及独立证据图，并用 BAPPS 判断评价。", note: "纹理项比较分布，但 Oklab 颜色项仍需要像素对应。2026 年 10 月发表；预印本为 arXiv:2601.19680。"}
"FSIMc": {title: "FSIM：面向图像质量评价的特征相似性指标", tldr: "在亮度通道比较相位一致性和梯度幅值；彩色版本 FSIMc 额外加入 YIQ 色度相似性项。", note: "输出单个分数。逐像素特征比较使其对亚像素错位敏感，详见指南。"}
"VSI": {title: "VSI：由视觉显著性驱动的感知图像质量指标", tldr: "将视觉显著图同时用作相似性特征及汇聚权重，并结合梯度与颜色对立空间中的色度相似性。"}
"MDSI": {title: "均值偏差相似性指标：高效可靠的全参考图像质量评价", tldr: "结合梯度相似性与高斯颜色模型中的联合色度相似性，再按偏差汇聚为单个分数，0 表示完全一致。"}
"QSSIM": {title: "四元数结构相似性：一种彩色图像质量指标", tldr: "将每个 RGB 像素表示为四元数，从而跨颜色通道联合计算类似 SSIM 的亮度、对比度与结构项。"}
"PerSIM": {title: "PerSIM：感知均匀颜色域中的多分辨率图像质量评价", tldr: "在 CIELAB 中以多分辨率比较明度与彩度通道，并采用受视网膜启发的滤波。"}
"CSV": {title: "CSV：结合颜色、结构与视觉系统的图像质量评价", tldr: "融合 CIEDE2000、颜色名称描述子的 EMD、归一化结构图及视网膜对比敏感度图，评价感知变化而非单纯的绝对颜色变化。"}
"LPIPS": {title: "深度特征作为感知指标的有效性研究", tldr: "在对应空间位置上计算归一化深度特征的加权 L2 距离，并以 BAPPS 人类二选一判断标定。", note: "逐位置比较使其对错位敏感；可参阅深度特征分类中的 ST-LPIPS 与 E-LPIPS。"}
"PieAPP": {title: "PieAPP：通过成对偏好评价感知图像误差", tldr: "从成对偏好概率学习图像块感知误差，再使用学习得到的权重汇聚。"}
"DeepSim": {title: "DeepSim：用于图像质量评价的深度相似性", tldr: "在对应位置比较预训练 CNN 特征的局部相似性，再跨层汇聚；比较均值、偏差与分位数汇聚方法。", note: "请勿与 DeepSSIM 混淆。"}
"MaD-DLS": {title: "MaD-DLS：以深度与局部相似性的均值和偏差评价图像质量", tldr: "将深度特征和局部相似性图的均值、标准差汇聚为质量分数。"}
"Peli band-limited contrast": {title: "复杂图像中的对比度", tldr: "逐像素、逐倍频程计算局部带限对比度：带通图像除以低一个倍频程的低通图像，同时讨论 RMS 对比度。", note: "逐像素比较对比度图需要配准；逐频带比较其分布则不需要，详见指南。"}
"Perceived contrast": {title: "复杂图像中的感知对比度", tldr: "利用分类图像实验研究哪些空间频率主导照片对比度判断，主要为每视角度 1–6 周期；仅有 CSF 不足，还需向低频的增益控制。"}
"MS-SSIM": {title: "用于图像质量评价的多尺度结构相似性", tldr: "在二倍下采样金字塔上计算 SSIM 对比度与结构项，只在最粗尺度计算亮度项，并采用心理物理实验拟合的尺度权重。"}
"SSIM": {title: "图像质量评价：从误差可见性到结构相似性", tldr: "比较局部亮度、对比度与结构；对比度项 c = 2σxσy/(σx²+σy²) 对称且经过压缩，无法区分对比度增加或减小。", note: "局部归一化会削弱全局光度变化的影响；对色偏的响应需结合所用颜色通道与实现检查，详见指南。"}
"DRIM": {title: "与动态范围无关的图像质量评价", tldr: "针对不同动态范围图像输出三种概率图：可见对比度损失、不可见对比度放大，以及对比度反转。", note: "模型刻意对轻微色调曲线变化不敏感，报告的是可见性变化，而非对比度幅度变化。"}
"TMQI": {title: "色调映射图像的客观质量评价", tldr: "结合相对 HDR 参考的多尺度结构保真度与 LDR 色调映射图像的统计自然度，仅使用亮度信息。"}
"GMSD": {title: "梯度幅值相似性偏差：高效的感知图像质量指标", tldr: "逐像素比较亮度图像的 Prewitt 梯度幅值，再以相似性图的标准差汇聚为单个分数。"}
"TMQI-II": {title: "通过优化色调映射图像质量指标实现 HDR 图像压缩", tldr: "修订 TMQI 的结构保真度和自然度项，并将改进后的指标用作色调映射优化目标。"}
"castleCSF": {title: "castleCSF：联合颜色、面积、时空频率、亮度与偏心度的对比敏感度函数", tldr: "用 18 组数据拟合解析 CSF，覆盖时空频率、任意颜色方向、亮度、背景色度、偏心度与面积，是 ColorVideoVDP 的敏感度模型。", note: "并非独立的图像指标，而是预测微小彩色或非彩色对比是否可见；仓库内提供数据。"}
"TM metric adaptation": {title: "使质量指标适用于色调映射", tldr: "通过显示模型将 HDR 参考与 SDR 色调映射结果转换为光度值，再以感知传递函数统一编码，使通用指标适用于该任务，并提出 ColorVideoVDP-tm。", note: "数据集为 TMQ-ME（DOI：10.17863/CAM.129808）；项目页为 kenchen10.github.io/projects/tmometric。"}
"CD-Net (SPCD)": {title: "智能手机摄影图像的感知色差测量", tldr: "建立 30,000 对带主观评分的 SPCD 数据，其中 10,000 对来自六部手机拍摄的相同场景、仅进行全局配准，其余为已对齐的编辑结果；在此基础上训练轻量色差网络。", note: "仓库列出 SPCD 的 Google Drive、百度网盘与 Kaggle 链接；所比较的 33 种方法多数在未严格配准的图像对上表现更差。"}
"CD-Flow": {title: "学习用于摄影图像的深度色差指标", tldr: "用归一化流将图像映射为多尺度特征，再计算欧氏距离；模型学会更多依赖粗尺度，从而容忍小幅几何失真。"}
"CD-iNet": {title: "CD-iNet：利用深度可逆网络测量感知图像色差", tldr: "通过可逆网络学习颜色坐标变换，使欧氏距离与感知色差对应，输出局部差异图；论文报告对一定几何失真具有鲁棒性。", note: "仅发布演示代码，未发布训练代码。"}
"MS-SWD": {title: "多尺度切片 Wasserstein 距离作为感知色差指标", tldr: "无需训练，在五层金字塔上比较 11×11 CIELAB 图像块分布的切片 Wasserstein 距离；投影排序不使用像素位置，因此不需要逐像素配准。", note: "也提供投影可训练的变体。随机投影会使结果随种子改变，使用时应固定随机种子。"}
"CD-Attention": {title: "基于注意力的摄影图像色差感知", tldr: "为结合局部颜色线索和图像上下文，利用 ViT 特征通过可变形注意力引导 CNN，再融合高频与低频评分分支；在 SPCD 及其非配准子集上评价。", note: "论文称可向第一作者申请代码。"}
"Skin-tone CD": {title: "人像摄影中的感知肤色色差测量", tldr: "建立含 40,000 组三元组、160,000 次判断的人像肤色色差数据，并训练深度肤色色差指标。", note: "作者宣布将发布数据和代码，但未找到公开资源；未讨论错位容忍能力。"}
"SDR–HDR Siamese CD": {title: "利用孪生神经网络计算图像色差", tldr: "用 504 对 SDR 图像及由其转换得到的 HDR 图像，训练包含颜色空间转换、特征提取与色差预测头的孪生网络。"}
"Reproduction difference model": {title: "迈向颜色再现差异模型", tldr: "针对色域映射后的再现图像建立整图视觉差异模型，考虑输出色域和图像内容；论文报告其预测优于平均 ΔE。"}
"CD-Reasoning": {title: "利用多模态大语言模型测量并解释色差", tldr: "在 M-SPCD 上微调多模态大模型；该数据为 SPCD 增加白平衡、对比度、亮度和颜色等七类属性描述，使模型同时输出分数与文字解释。", note: "检查点位于百度网盘，提取码为 6s5d；未单独列出 M-SPCD 文字标注的下载链接。"}
"Photo CD (Niu 2026)": {title: "摄影图像的感知色差测量", tldr: "利用按目标排序的对比学习训练深度色差模型，使预测差异保持感知上的连续性与次序。", note: "摘要未说明配准、数据集或代码信息。"}
"Tone style scorer (ICTone)": {title: "通过大规模三元组数据集实现上下文色调风格迁移", tldr: "先进行对比预训练，再用 20,000 次人类排序学习色调风格嵌入，以余弦相似性评价结果是否匹配内容不同的参考图像风格。", note: "测量的是风格匹配，而非一般色差；指标检查点位于 Hugging Face 的 ToneStyle/MetricCkpt。"}
"Color histogram intersection": {title: "颜色索引", tldr: "计算两个颜色直方图的重叠量，是早期广泛使用的不依赖位置的颜色相似性方法；结果有上界，且依赖直方图分箱方式。"}
"Color moments": {title: "彩色图像的相似性", tldr: "以加权 L1 距离比较各通道的均值、标准差与偏度，每幅图像共九个数；较粗略，但对错位影响较小。", note: "原文在 HSV 中计算颜色矩；用于色差研究时，可考虑 CIELAB。"}
"Quadratic-form histogram distance": {title: "用于二次型距离函数的高效颜色直方图索引", tldr: "QBIC 直方图距离以跨分箱的颜色相似性权重减轻分箱边界影响；论文还给出低成本下界，以预筛数据库。"}
"Color coherence vectors": {title: "利用颜色一致性向量比较图像", tldr: "将每个颜色分箱拆为属于大连通区域的像素和分散像素，分别建立并比较两个直方图。"}
"Color correlogram": {title: "利用颜色相关图进行图像索引", tldr: "统计距离颜色 i 像素为 k 的位置出现颜色 j 的概率；实验采用 i = j 的自相关图，为直方图加入空间颜色相关性。"}
"Earth Mover's Distance": {title: "用于图像检索的地球移动距离", tldr: "计算把一个颜色分布（直方图或特征签名）搬运为另一个分布的最小成本；在 CIELAB 中可解释为需要搬运的平均颜色距离。", note: "用 k-means 构建特征签名会引入运行间随机性；固定分箱较稳定，但精度更粗。"}
"MPEG-7 color layout": {title: "颜色与纹理描述子", tldr: "将图像缩为 8×8 的平均 YCbCr 网格，再计算 DCT 并比较少量低频系数：Y 通道六个，Cb 与 Cr 各三个。", note: "系数选择参照 Kasutani 与 Yamada，ICIP 2001（DOI：10.1109/ICIP.2001.959135）。"}
"Colorfulness": {title: "自然图像的丰富色彩感测量", tldr: "使用两个颜色对立通道的均值和标准差拟合色彩丰富度评分；两幅图像分数的比值可反映整体饱和度变化。", note: "设计上忽略色相，因此无法检出单纯的色相旋转。"}
"Histogram intersection for image similarity": {title: "通过直方图交集评价图像相似性", tldr: "在多个色空间中，用视觉相似性判断评价直方图交集；是 SPCD 与 MS-SWD 论文中的 Lee05 基线。"}
"Sliced Wasserstein distance": {title: "Wasserstein 重心及其在纹理混合中的应用", tldr: "将三维颜色分布投影到随机方向，对每个一维投影排序，再平均一维 Wasserstein 距离；与 EMD 思路相近，但计算更便宜。", note: "理论参见 Bonneel 等，J Math Imaging Vis 2015（DOI：10.1007/s10851-014-0506-3）；只沿 L*、a*、b* 轴投影得到的是逐通道一维 Wasserstein 距离。"}
"Bidirectional similarity (BDS)": {title: "利用双向相似性概括视觉数据", tldr: "要求每幅图像的每个图像块都能在另一幅图像的某处找到近似匹配，以同时保证完整性与一致性，常用于图像重定向。", note: "最近邻搜索也可能吸收真实颜色差异，因此分辨整体色偏的能力有限。"}
"CW-SSIM": {title: "复小波结构相似性：一种新的图像相似性指标", tldr: "在复数可转向金字塔系数上计算 SSIM；相对滤波器尺寸较小的平移主要表现为相位旋转，因此能够容忍一定小幅错位。", note: "该亮度指标无法反映纯色偏；在错位测试中表现稳定，并不意味着具备颜色判别能力，详见指南。"}
"STSIM": {title: "面向图像分析与检索的结构纹理相似性指标", tldr: "全局或在滑动窗口中比较少量可转向子带统计，明确允许两种纹理在逐像素层面存在较大差异。"}
"GPDM": {title: "通过直接匹配图像块分布生成自然图像", tldr: "生成方法以多尺度 RGB 图像块分布之间的切片 Wasserstein 距离作为损失，也可用作不依赖位置的图像距离。", note: "MS-SWD 复用其部分代码；主要区别是 CIELAB 与 RGB 的选择、图像块尺寸及尺度数量。"}
"TPIPS": {title: "视觉相似性的多重含义：文本提示的图像感知指标", tldr: "为区分视觉相似性的不同含义，使用物体颜色、光照等自由文本属性下的人类判断微调视觉语言模型；推荐的嵌入版本比较图像表征，不需要像素对应。", note: "属于属性条件相似性，不是经标定的 ΔE 或专用摄影色差模型；已发布嵌入、早期融合、激活距离变体、检查点及两个数据集。"}
"Contextual Loss": {title: "用于非配准数据图像变换的上下文损失", tldr: "每个特征在另一幅图像的所有位置中寻找最相似特征，而不是只与相同坐标处的特征比较。"}
"CoBi": {title: "放大学习，学习放大", tldr: "上下文双边损失在上下文匹配之外加入空间距离惩罚，作用于 RGB 图像块与 VGG 特征，以轻度错位的 SR-RAW 图像对训练。"}
"SIFID": {title: "SinGAN：从单幅自然图像学习生成模型", tldr: "单图像 FID，计算两幅图像内部深度特征均值与协方差之间的 Fréchet 距离。"}
"STROTSS": {title: "通过松弛最优传输与自相似性实现风格迁移", tldr: "比较两组深度特征之间的松弛最优传输距离，用作风格损失；构造上不要求逐位置对应。"}
"E-LPIPS": {title: "E-LPIPS：通过随机变换集成实现稳健感知图像相似性", tldr: "对两幅图像施加相同的随机变换，包括平移、翻转、轴交换、缩小、颜色置换与缩放、随机失活，再平均 LPIPS，主要用于抵抗对抗攻击。", note: "两幅图像接受相同变换，因此不能据此认为其容忍图像之间的相对错位。"}
"DISTS": {title: "图像质量评价：统一结构与纹理相似性", tldr: "比较 VGG 特征图的空间均值（纹理）与相关性（结构）；论文报告对轻微平移、膨胀等几何变换相对不敏感。"}
"Projected Distribution Loss": {title: "用于图像增强的投影分布损失", tldr: "匹配深度特征分布的一维投影，而不强制要求特征处于对应空间位置。"}
"A-DISTS": {title: "面向图像质量评价的局部自适应结构与纹理相似性", tldr: "依据局部内容的离散程度，自适应调整 DISTS 中纹理项和结构项的权重。"}
"Sliced Wasserstein texture loss": {title: "用于神经纹理合成的切片 Wasserstein 损失", tldr: "比较 VGG-19 特征分布的切片 Wasserstein 距离，是 MS-SWD 像素图像块分布在深度特征域中的对应思路。"}
"CVRKD": {title: "通过知识蒸馏实现内容不同参考图像的质量评价", tldr: "以内容不同的高质量图像作为参考，让从全参考教师蒸馏的学生网络利用这种非配准参考预测质量。"}
"DeepWSD": {title: "DeepWSD：将感知空间中的退化映射为深度特征空间的 Wasserstein 距离", tldr: "无需训练，在图像及各 VGG 层的小窗口内，比较特征分布的一维 Wasserstein 距离。", note: "分布比较发生在局部窗口，论文未宣称具有错位鲁棒性。"}
"ST-LPIPS": {title: "容忍平移的感知相似性指标", tldr: "重新设计 LPIPS 骨干中的抗混叠、池化、步幅与填充，使数像素范围内不可察觉的平移较少影响分数。", note: "论文测试了 1–3 像素的水平平移。"}
"DreamSim": {title: "DreamSim：利用合成数据学习人类视觉相似性的新维度", tldr: "拼接 CLIP、OpenCLIP 与 DINO 嵌入，以 NIGHTS 人类相似性三元组微调；关注前景物体和语义，同时保留对颜色与布局的敏感性。"}
"MIPM": {title: "用于全参考图像质量评价的错位不敏感感知指标", tldr: "在重叠局部窗口内比较深度特征分布的 Wasserstein 差异（LOWD），结合通道注意力，针对 GAN 复原结果与参考错位的情形。"}
"DepictQA": {title: "超越分数的描述：通过多模态语言模型推进图像质量评价", tldr: "利用多模态大模型，用文字比较一个参考与两个待测图像；作者指出图像错位时，分数型指标可能与人类判断不一致。"}
"DOSS": {title: "全参考图像质量评价：通过深度特征顺序统计解决内容错位", tldr: "先将深度特征排序再比较，使顺序统计不再依赖内容原本所在的位置。"}
"GRIDS": {title: "用于全参考图像质量评价的图表示分布相似性指标", tldr: "将深度特征表示为图结构，再比较其分布。", note: "模型权重位于百度网盘，提取码为 tmtj。"}
"DeepDC": {title: "DeepDC：以深度距离相关性评价感知图像质量", tldr: "将深度特征通道作为观测计算距离相关性，不要求逐点配准，并在几何变换数据上评价。"}
"Puzzle Similarity": {title: "Puzzle Similarity：用于三维场景重建伪影检测的感知跨参考指标", tldr: "从训练视角建立图像块特征分布，无需与新视角配准的参考，即可定位新视角图像中的伪影。"}
"DeepSSIM": {title: "深度特征中的结构相似性：适应几何差异参考的统一图像质量评价", tldr: "对 VGG16 conv5_1 特征的 Gram 矩阵进行类似 SSIM 的比较；跨空间位置求和舍弃位置信息，可用于超分辨率与图像重定向参考。", note: "论文未讨论颜色；以替代 VGG 权重进行的非正式测试中，对色调变化有响应，但对白平衡色偏较弱。PyTorch 版 DeepSSIM-Lite 面向优化。"}
"MIIDP": {title: "用于全参考去雾图像质量评价的错位容忍感知相似性指标", tldr: "用不依赖位置的离散 VQ 码本表征替换连续 CNN 特征，以评价与参考存在错位的去雾结果。"}
"MSDS": {title: "MSDS：结合多尺度表征的深度结构相似性", tldr: "在金字塔各层计算 DeepSSIM，再用少量可学习全局权重融合分数；论文报告相对单尺度版本的持续改进。"}
"MRFEM-KL": {title: "利用多分支残差特征增强与自适应分布度量评价图像质量", tldr: "在 VGG19 中加入多分支残差增强模块，并以 KL 散度加余弦距离比较滑动窗口中的特征分布。", note: "作为分布指标的比较基线收录。尚无已确立的错位容忍证据；对应空间位置的滑动窗口保守标为需要像素配准。"}
"CrossScore": {title: "CrossScore：迈向多视角图像评价与评分", tldr: "以同一场景的其他视角为输入，通过交叉注意力预测渲染视角的 SSIM 图；使用新视角合成优化过程中采集的数据训练，无需对齐真值。"}
"NOVA": {title: "面向新视角合成的非配准参考图像质量评价", tldr: "比较渲染视角与邻近非配准视角的 LoRA 微调 DINOv2 嵌入余弦距离，在 DISTS / DeepDC 监督下利用合成退化进行对比三元组训练。", note: "仓库提供合成退化与新视角合成微调检查点；NVS-NAR-IQA 用户研究数据列于数据集部分。"}
"PR-IQA": {title: "PR-IQA：面向扩散式新视角合成的部分参考图像质量评价", tldr: "先在生成视角与另一相机位姿参考共有的区域计算质量图，再用交叉注意力 U-Net 补全为稠密逐像素图。", note: "重叠区域通过 DINOv2 与 VGGT 特征的三维对应寻找，而非逐像素配准；检查点位于 Hugging Face 的 kakaomacao/PR-IQA。"}
"SCODA": {title: "从显式参考到场景流形：以分布保真度与真实感评价辐射场质量", tldr: "对场景干净视角的深度特征拟合多元高斯，以偏离程度衡量渲染视角的保真度，再融合图像块判别器的真实感分数；参考无需匹配测试位姿。"}
"CFM": {title: "鲜艳得不真实吗？生成图像颜色保真度的基准与标定", tldr: "在按颜色真实感排序的真实与生成图像数据 CFD 上训练多模态编码器，输出单幅图像的颜色保真度分数，惩罚偏好指标可能奖励的过度饱和与对比度。", note: "无需参考图像；CFM-7B 权重与 CFD 数据位于 Hugging Face 的 Nineve/CFM_7B 和 Nineve/CFD_dataset。"}
"ECC alignment": {title: "通过最大化增强相关系数实现参数化图像配准", tldr: "最大化对全局亮度与对比度变化不敏感的相关系数，以估计参数化几何变换，是多个基准所用的配准步骤。", note: "光度差异被消除而非估计报告，因此这一过程可能隐藏色差指标本应测量的部分变化。"}
"RealSR protocol": {title: "迈向真实世界单幅图像超分辨率：新基准与新模型", tldr: "通过改变焦距采集 LR / HR 图像对，迭代配准并匹配亮度均值与标准差，再在 Y 通道计算 PSNR / SSIM。"}
"PyNET protocol": {title: "用单个深度学习模型替代移动相机 ISP", tldr: "先用 SIFT 与 RANSAC 对手机 RAW 和单反照片做全局配准，再对每个 448×448 图像块搜索小幅平移和旋转；剔除互相关低于 0.9 的图像块。", note: "协议假设所有方法承受相同的残留错位，但错位仍会抬高绝对颜色误差。"}
"AIM 2020 ISP protocol": {title: "AIM 2020 学习式图像信号处理管线挑战赛", tldr: "保真赛道在粗配准 ZRR 图像块上用 PSNR / SSIM 评分，感知赛道采用平均主观意见分。"}
"DRealSR protocol": {title: "以组件分而治之实现真实世界图像超分辨率", tldr: "基准由五部单反相机的多焦距图像组成；先用 SIFT，再进行含亮度匹配的迭代图像块配准和人工检查，在 Y 通道计算 PSNR，在 RGB 上计算 SSIM / LPIPS。"}
"RealBlur protocol": {title: "用于去模糊学习与评测的真实世界模糊数据集", tldr: "评价脚本以 ECC 单应变换把每个结果对齐真值，再缩放强度、屏蔽无效边界，计算 PSNR / SSIM。", note: "只缩放图像强度，不进行颜色校正。"}
"MAI 2021 ISP protocol": {title: "在移动 NPU 上运行的学习式手机 ISP：Mobile AI 2021 挑战赛报告", tldr: "先通过稠密对应网络对齐手机 RAW 与 Fujifilm sRGB，再用 PSNR / SSIM 评价保真度，并在 NPU 上测量运行时间。"}
"Deep Burst SR protocol": {title: "深度连拍图像超分辨率", tldr: "用 PWC-Net 光流将输出对齐真值，在高斯平滑图像上拟合 3×3 颜色矩阵，屏蔽无效像素，再计算 PSNR / SSIM / LPIPS。", note: "先平滑再拟合颜色矩阵体现先聚合、后比较；但拟合出的颜色差异被消除，没有单独报告。"}
"NTIRE 2021 Burst SR protocol": {title: "NTIRE 2021 连拍超分辨率挑战赛：方法与结果", tldr: "真实数据赛道沿用 Deep Burst SR 的光流对齐、颜色校正后的 PSNR / SSIM / LPIPS 评测方式。"}
"LiteISPNet protocol": {title: "从不准确配准的监督中学习 RAW 到 sRGB 映射", tldr: "只对输出与目标进行几何配准，不做颜色校正，同时报告未配准时的指标。"}
"BIPNet protocol": {title: "连拍图像复原与增强", tldr: "连拍超分辨率采用 BurstSR 真实数据协议，包括光流对齐、颜色校正和掩膜；去噪与低光增强使用各自标准指标。"}
"NTIRE 2022 Burst SR protocol": {title: "NTIRE 2022 连拍超分辨率挑战赛", tldr: "真实赛道不再使用配准与颜色校正后的指标，改为人工评价排名，因为旧指标偏向采用相同配准损失训练的方法。"}
"SelfDZSR protocol": {title: "从双变焦观测自监督学习真实世界超分辨率", tldr: "将真值的颜色与亮度匹配输入，再将其几何变换到输入坐标，最后计算全参考指标。"}
"cPSNR (PROBA-V)": {title: "HighRes-net：卫星图像多帧超分辨率的递归融合", tldr: "PROBA-V 挑战赛的清晰像素 PSNR；先裁剪边界，在 49 种整数平移中选最佳结果，并消除亮度偏差后评分。", note: "选取最佳平移会向下偏置误差，类似在邻域中取最小 ΔE。"}
"Seam-side color difference (stitching)": {title: "用于针孔相机阵列图像拼接的视差容忍弱监督逐像素深度颜色校正", tldr: "除重叠区 PSNR / SSIM 外，还比较拼缝两侧窄条区域的平均颜色，以先平均、后比较的方式评价有视差时的颜色一致性。"}
"CameraVDP": {title: "CameraVDP：通过相机与视觉差异预测实现带不确定度的感知显示评价", tldr: "拍摄显示器后校正相机几何、MTF、渐晕和颜色，颜色使用一次性光谱辐射计标定，再以视觉差异预测器给出带置信区间的结果。", note: "颜色只标定一次，不逐图匹配参考，因此保留显示器的真实颜色误差。"}
"Recovery angular error": {title: "重新评价颜色恒常性算法性能", tldr: "计算估计与真实光源 RGB 向量之间的夹角，不受强度缩放影响；提倡用中位数而非均值汇总误差，并在算法比较时做统计检验。", note: "两幅图像间的逐像素 RGB 夹角在暗部不稳定，应改为比较区域或图像均值。"}
"Perceptual illuminant distances": {title: "颜色恒常性算法距离度量的感知分析", tldr: "通过心理物理实验研究估计光源与真实光源之间的距离（包括角度误差），能否预测观察者对校正图像的判断。"}
"Reproduction angular error": {title: "用于光源估计算法评价的再现角度误差", tldr: "计算估计光源校正后的白色表面与真正中性白之间的夹角，度量校正图像中的可见误差，而非仅比较光源向量。", note: "最早在 BMVC 2014 提出，DOI 为 10.5244/C.28.70。"}
"MIS acceptability": {title: "利用多光照场景 MIS 数据集检验色差模型的可接受性预测", tldr: "为评价白平衡误差是否可接受，在单光源和多光源场景中收集 3,465 次观察者试验；提出颜色外观加权与进一步考虑空间、照度因素的修正。", note: "可接受性不同于差异大小和审美偏好；无需配准标签指白平衡误差协议，并不保证对任意视角变化不敏感。"}
"Beyond angular error": {title: "超越角度误差：重新思考白平衡指标及其对图像颜色外观的影响", tldr: "将相机 (R/G, B/G) 平面的光源误差分解为沿普朗克轨迹及垂直于轨迹的分量，并提高垂直分量权重，以更好反映颜色外观误差。", note: "证据来自 ColorChecker 的 CIELAB ΔE，不是心理物理实验。"}
"ColorChecker ΔE": {title: "一种颜色再现测试图卡", tldr: "在 24 个色块中心计算平均与最大 ΔE00，以及不含明度的 ΔC00、饱和度比和灰色色块白平衡误差。", note: "原文为 McCamy、Marcus 与 Davidson，J Appl Photogr Eng 2(3):95–99。链接提供参考数据；2014 年 11 月色料变更，两个版本平均相差 0.85 ΔE00，需匹配实际图卡。"}
"ISO 17321-1": {title: "ISO 17321-1:2012 印刷技术与摄影：数字静态相机颜色表征，第 1 部分：刺激、计量与测试程序", tldr: "规定相机颜色响应表征所需的刺激、测量与程序，包括利用测试目标拟合相机 RGB 到 XYZ 的变换。"}
"Root-polynomial color correction": {title: "利用根多项式回归进行颜色校正", tldr: "对 RGB 乘积的 k 次方根进行相机到 XYZ 的多项式回归，使拟合保持曝光缩放不变性。", note: "也可由区域均值拟合两幅图像间的颜色映射，输出可解释参数及残差。"}
"ISO 14524 OECF": {title: "ISO 14524:2009 摄影：电子静态相机光电转换函数测量方法", tldr: "通过灰阶图卡测量色调曲线，即相机由场景亮度到输出数值的光电转换与对比度传递。"}
"ISO 15739 noise": {title: "ISO 15739:2023 摄影：电子静态成像噪声测量", tldr: "使用均匀色块测量信噪比、视觉噪声及受噪声限制的动态范围；视觉噪声采用颜色对立空间中的逐通道 CSF 加权。"}
"Visual noise metric": {title: "建立经过感知标定的客观噪声指标", tldr: "以模拟手机噪声开展软拷贝质量标尺实验，将客观噪声指标标定到恰可察觉差异单位。"}
"CPIQ spatial metrics": {title: "I3A CPIQ 空间指标的建立", tldr: "说明如何结合颜色对立空间中的 CSF 加权，以及显示或打印 MTF，构建 CPIQ 边缘锐度、纹理锐度与视觉噪声指标。"}
"IEEE 1858 CPIQ": {title: "IEEE 1858-2023 手机相机图像质量标准", tldr: "包括空间频率响应、颜色均匀性、彩度水平、横向色偏、畸变、纹理模糊与视觉噪声，并将各项转换为以 JND 表示的质量损失。", note: "DOI 为 10.1109/IEEESTD.2023.10205967，取代 IEEE 1858-2016。"}
"ISO 17957 shading": {title: "ISO 17957:2015 摄影：数字相机阴影与场均匀性测量", tldr: "使用均匀目标测量画面范围内的亮度与颜色不均匀性。"}
"Mahalanobis color separation": {title: "以 Mahalanobis 距离稳健度量颜色信号分离程度", tldr: "使用合并噪声协方差，以噪声为参照测量两个色块的可分性；不同于 ΔE2000 或 Δa*b*，对可逆白平衡、CCM 等线性处理具有不变性。"}
"ISO 12233 SFR": {title: "ISO 12233:2024 数字相机分辨率与空间频率响应", tldr: "以四倍过采样的边缘剖面计算斜边 SFR，即对比度随空间频率的传递；边缘位置由数据拟合，因此 ROI 平移不直接影响结果。", note: "算法背景见 Burns，PICS 2000；第四版的多项式边缘拟合与 Tukey 窗更新见 Burns 等，IS&T EI 2022（DOI：10.2352/ei.2022.34.9.iqsp-357）。"}
"ISO/TS 19567-2 dead leaves": {title: "ISO/TS 19567-2:2019 摄影：数字相机纹理再现测量，第 2 部分：随机图案纹理分析", tldr: "从由随机遮挡圆盘构成的枯叶图卡计算纹理 MTF，可揭示斜边测试难以反映的自适应降噪行为。"}
"Dead leaves texture MTF": {title: "用于测量数字相机纹理质量的枯叶模型", tldr: "在尺度不变枯叶图案上，将输出与图卡功率谱之比的平方根定义为纹理 MTF；功率谱忽略相位，因此不依赖图案位置。", note: "早期版本见 Cao、Guichard 与 Hornung，Proc SPIE 7250，2009（DOI：10.1117/12.805853）。"}
"Noise-corrected dead leaves": {title: "利用枯叶目标进行纹理空间频率响应测量：扩展与真实相机应用", tldr: "在计算纹理 MTF 前，从输出功率谱中减去在均匀色块上测得的噪声功率。", note: "假设灰色色块与纹理区域的噪声相同，但自适应降噪可能破坏这一条件。"}
"Intrinsic dead leaves": {title: "用枯叶目标描述纹理损失：现有问题与新的内在方法", tldr: "计算拍摄图像与已知图卡图案的互功率谱，能够抑制噪声影响并恢复相位，但参考必须精确配准。"}
"Dead leaves misregistration": {title: "配准误差对枯叶互相关纹理模糊分析的影响", tldr: "显示仅 0.15 像素的错位就会使互相关 MTF 的实部强烈波动，并建议改用传递函数的模。"}
"ISO 19084 chromatic displacement": {title: "ISO 19084:2015 摄影：数字相机色位移测量", tldr: "定义同一边缘处颜色通道之间的偏移，即横向色差，并规定从相机输出测量该偏移的图案、条件与程序。", note: "不设置通过或失败阈值；测试软件通过 imaging.org 分发，该标准于 2025 年获确认。"}
"Color-difference model evaluation review": {title: "色差模型评价方法综述", tldr: "为避免任意方向采样，以完整椭球积分比较预测和实测判别椭球，分析坐标不变性、尺度优化，以及 STRESS、gamma 类和几何指标的差异。", note: "评价的是局部颜色判别模型，并非新的图像对指标。"}
"Empirical 3D color metric field": {title: "颜色空间的经验三维度量场", tldr: "在三维 sRGB 空间中，由八位观察者对 35 个参考色沿七种方向进行判别测量，拟合最小体积椭球并插值其正定矩阵，再与 CIEDE2000 的局部各向异性比较。", note: "研究指定观察条件下的阈值判别，而非阈上摄影图像色差。"}
"Texture-dependent color tolerances": {title: "纹理对阈上色差容限的影响：视觉容限数据集", tldr: "将十种纹理与 11 个颜色中心、18 个方向组合，由 26 位观察者将差异匹配至 2.1 ΔE*ab 锚点，研究均匀色块容限能否迁移至纹理刺激，以及明度、彩度、色相容限的纹理依赖。", note: "心理物理数据研究；本次更新未确认可下载的实现或独立数据发布。"}
"Metamer mismatching and discrimination": {title: "同色异谱失配预测色差椭球", tldr: "检验同色异谱失配造成的颜色变异是否能够预测色差椭球，以解释色空间各处判别阈值为何不同，补充基于心理物理数据拟合的经验公式。", note: "属于判别几何的理论假说，并非替代性的图像差异分数。"}
"Histogram distance benchmark": {title: "颜色与纹理非相似性度量的实验评价", tldr: "在颜色和纹理分类、检索及分割任务上，大规模比较九种分布差异度量，包括 χ²、Kolmogorov–Smirnov、EMD、二次型与交集。"}
"STRESS": {title: "感知色差与计算色差关系的测量", tldr: "用 STRESS 检验色差公式与视觉数据的一致性，0 表示完全一致，并提供检验两个公式差异是否显著的统计方法。"}
"RetargetMe": {title: "图像重定向的比较研究", tldr: "通过用户研究评价重定向方法及比较几何差异较大图像的指标；EMD 与 SIFT-flow 排名最接近用户，优于 BDS 和边缘直方图。"}
"ΔE survey": {title: "色差 ΔE 综述", tldr: "回顾感知均匀色空间及直至 CIEDE2000 的 ΔE 公式，讨论何时应将两种颜色视为相似或不同。"}
"MLLM IQA study": {title: "多模态大语言模型用于图像质量评价的综合研究", tldr: "在多类质量任务上测试多模态大模型；GPT-4V 在 SPCD 色差上的 SRCC 仅为 0.122，各模型均难以进行精细比较。"}
"WCG / HDR ΔE evaluation": {title: "宽色域与高动态范围色差模型评价", tldr: "采集覆盖宽色域、高亮度及大小色差的心理物理数据；在最高 1611 cd/m² 条件下，幂修正 CAM16-UCS 泛化较好，但没有模型达到期望精度。"}
"Color difference in context": {title: "上下文中的色差：一项实验", tldr: "相同颜色对在不同背景上会产生显著不同的差异判断，说明忽略上下文而继续改进逐点公式的收益有限。"}
"Color IQA survey": {title: "彩色图像质量评价研究进展", tldr: "综述彩色图像质量评价方法、数据集与尚待解决的问题。"}
"Low-level vision tests of metrics": {title: "通过低层视觉心理物理测量评价质量指标", tldr: "以对比敏感度、掩蔽与匹配数据测试 34 个指标；CIEDE2000 和 HyAB 对非彩色对比更敏感，S-CIELAB、FLIP、MS-SWD 和 ΔE ITP 则呈相反趋势。", note: "对应预印本编号为 arXiv:2503.16264。"}
"Hue non-uniformity perception": {title: "显示器色相不均匀性感知研究：感知数据与色差模型比较", tldr: "通过二选一实验研究显示器颜色不均匀性，发现感知取决于差异的空间图案，而不只是均值；CIEDE2000 及 CSF 滤波变体均无法完整预测。"}
"Uniformity error for color spaces": {title: "适用于标准与高动态范围色空间的感知均匀性误差指标", tldr: "提出误差指标，衡量标准或 HDR 色空间的感知均匀程度。"}
"VLM psychophysics": {title: "利用心理物理数据评价视觉语言模型的图像质量判断", tldr: "受控比较对比度、色彩丰富度与偏好，发现模型与观察者的一致性随属性变化，且较高的自身一致性不代表感知判断准确。"}
"ISO 20462-3 quality ruler": {title: "ISO 20462-3:2012 摄影：图像质量估计的心理物理实验方法，第 3 部分：质量标尺法", tldr: "观察者将待测图像与经过标定的一系列标尺图像比较，得到以一个恰可察觉差异为单位的标准质量量表 SQS 分数；第 1、2 部分分别介绍总览及三元比较。", note: "IEEE 1858 CPIQ 的 JND 量表通过此类实验进行标定。"}
